name: CI

# Runs on pull requests (so a change is tested BEFORE it reaches master, which Vercel deploys to production),
# on pushes to master, and manually. Needs no secrets: tests use a throwaway Postgres service container,
# never a real database, and the e2e build uses dummy credentials. The steps live in
# .github/actions/{setup,verify} and are shared with the dependency-update workflow.
# To block merging untested code, mark the "test" check as required in
# GitHub -> Settings -> Branches (branch protection for master).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR / branch; a newer push cancels the older run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/streamapp_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/verify

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
