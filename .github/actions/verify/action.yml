name: Verify
description: >-
  Type check, lint, unit tests, migrations + schema-drift guard, integration tests and end-to-end tests
  against a production build. The job must provide TEST_DATABASE_URL (a throwaway Postgres, never a real
  database) and have the dependencies installed.
runs:
  using: composite
  steps:
    - name: Type check
      shell: bash
      run: pnpm check-types

    - name: Lint (no warnings allowed)
      shell: bash
      run: pnpm lint

    - name: Unit tests
      shell: bash
      run: pnpm test

    - name: Migrate the test database and check the migrations match the schema
      shell: bash
      env:
        # prisma.config.ts prefers the unpooled URL: point both at the throwaway database.
        DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        DATABASE_URL_UNPOOLED: ${{ env.TEST_DATABASE_URL }}
      run: |
        pnpm db:migrate
        # Fails when prisma/schema.prisma has changes that no migration in prisma/migrations covers.
        pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

    - name: Integration tests
      shell: bash
      run: pnpm test:integration

    - name: Cache Next.js build cache
      uses: actions/cache@v6
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.js') }}
        restore-keys: |
          next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Install Playwright browser
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: End-to-end tests (builds and starts the app on the test database)
      shell: bash
      run: pnpm test:e2e
