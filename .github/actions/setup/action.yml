name: Setup toolchain
description: pnpm (version from package.json "packageManager") + Node 22 with the pnpm store cached. Run after actions/checkout.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
